# Configuration du bot de scalping Tradeify 50k Select.
# Toutes les valeurs de risque sont des garde-fous DURS : si un seuil est atteint,
# le RiskManager force la mise a plat et bloque les nouveaux trades pour la session.

mode: demo            # demo | live  (JAMAIS live avant validation demo prolongee)
symbol: MNQ           # instrument trade par defaut (le bot vise le Nasdaq)
tick_size: 0.25       # surcharge par instruments[symbol] ci-dessous
tick_value: 0.50
timeframe_minutes: 5  # STRATEGIE VALIDEE = Donchian breakout en M5

# Specs des micro futures CME. tick_value = USD par tick (0.25 point).
instruments:
  MES: {tick_size: 0.25, tick_value: 1.25}   # Micro S&P  : 5 USD/point
  MNQ: {tick_size: 0.25, tick_value: 0.50}   # Micro Nasdaq : 2 USD/point

# Frais realistes a inclure dans le backtest (sinon on se ment sur l'edge).
costs:
  commission_per_contract: 0.75   # commission par contrat par cote (aller ET retour comptes)
  slippage_points: 0.25           # slippage estime par cote, en points

# Strategie VERROUILLEE apres validation (walk-forward 4/4 + holdout + croisee S&P
# + pool MNQ/MES : holdout 136 trades, PF 1.25, +3658 net). SMT teste et rejete.
strategy_name: donchian   # scalper | vwap | orb | meta | rsi2 | bollinger | donchian | fvg

account:
  # Parametres du compte Tradeify 50k Select. A ajuster selon la spec exacte du jour.
  balance: 50000.0
  trailing_drawdown: 2000.0   # trailing max drawdown du 50k Select
  daily_loss_limit: 1000.0    # limite de perte journaliere
  max_contracts: 5            # taille max de position autorisee
  consistency_pct: 0.30       # aucun jour ne doit depasser 30% du profit total

risk:
  risk_per_trade_usd: 75.0    # RISQUE REDUIT (vise MDD < 1500, sous la limite Tradeify)
  stop_ticks: 12              # stop en ticks (fallback ; les strategies utilisent l'ATR)
  target_ticks: 18            # target en ticks (R:R = 1.5)
  max_trades_per_day: 20      # 24h -> plus d'opportunites
  session_start: "00:00"      # 24h : trade all day (plus RTH-only)
  session_end: "23:59"

# Regle prop firm Tradeify : PAS d'overnight. On flatten tout a 16:45 ET (avant la
# maintenance CME ; auto-liquidation forcee a 16:59) et on ne rentre pas dans la
# fenetre flatten+break 16:30 -> 18:00 ET.
flatten:
  flatten_time: "16:45"     # force-close des positions ouvertes (heure ET)
  no_entry_from: "16:30"    # plus de nouvelles entrees a partir de cette heure...
  no_entry_to: "18:00"      # ...jusqu'a la reouverture Globex

strategy:
  ema_fast: 9
  ema_slow: 21
  rsi_period: 14
  rsi_long_max: 65            # ne pas acheter en surachat
  rsi_short_min: 35           # ne pas vendre en survente
  vwap_filter: true          # long au-dessus du VWAP, short en dessous
  min_confidence: 0.55
  atr_period: 14
  atr_stop_mult: 1.5         # stop = 1.5 x ATR (dimensionne a la volatilite)
  rr_ratio: 1.5              # target = 1.5 x stop

orb:
  orb_minutes: 15
  atr_period: 14
  atr_stop_mult: 1.0
  rr_ratio: 2.0
  max_entry_minutes: 120

vwap:
  atr_period: 14
  dev_mult: 2.0
  atr_stop_mult: 1.0
  rr_ratio: 1.5

meta:                     # selecteur de regime : route scalper (tendance) / vwap (range)
  ema_fast: 20
  ema_slow: 50
  atr_period: 14
  trend_threshold: 1.0    # |ema_fast-ema_slow|/atr au-dessus = momentum, sinon reversion

rsi2:                     # mean-reversion Connors : creux/pics filtres par tendance
  rsi_period: 2
  oversold: 10
  overbought: 90
  trend_period: 200
  atr_period: 14
  atr_stop_mult: 1.5
  rr_ratio: 1.5

bollinger:                # fade des bandes en range (ADX faible)
  bb_period: 20
  bb_k: 2.0
  adx_period: 14
  adx_max: 25
  atr_period: 14
  atr_stop_mult: 1.0
  rr_ratio: 1.5

donchian:                 # cassure de canal (breakout) — VALIDE sur VRAI MNQ (reproductible)
  # Databento CME (GLBX.MDP3), M5, 2 ans. Walk-forward 4/4 (+3565, 111 trades).
  # Holdout reproductible (seed fixe) : +432 net, PF 1.19, 50 trades, MDD 545.
  # Edge REEL mais MODESTE (PF ~1.2). Momentum ; le mean-reversion echoue sur ce marche.
  channel_period: 18
  adx_period: 14
  adx_min: 19.97
  atr_period: 14
  atr_stop_mult: 1.40
  rr_ratio: 2.99

fvg:                      # retest de Fair Value Gap (ICT / BPR)
  atr_period: 14
  atr_stop_mult: 1.0
  rr_ratio: 2.0
  max_age: 120

trendline:                # trendline multi-TF — MEILLEUR CANDIDAT (exec M5, detection htf M120=2h)
  # Vrai MNQ futures : robustesse 60% (+239 median), holdout +36 PF 1.03 (26 tr), MDD 570.
  # Edge REEL mais MARGINAL (PF ~1.03 hors-echantillon) -> forward-test demo avant tout capital.
  exec_minutes: 5
  htf_minutes: 120
  pivot_lookback: 4
  min_touches: 2
  tol_atr: 0.71
  break_margin_atr: 0.10
  require_retest: false
  retest_window: 20
  atr_period: 14
  atr_stop_mult: 2.02
  rr_ratio: 2.95

gex:
  enabled: true
  levels_file: data/gex_levels.json   # niveaux fournis par ton abonnement GEX
  proximity_ticks: 20                 # distance a un mur pour bloquer/booster

orderflow:
  enabled: false            # active quand un flux DOM/footprint est branche
  imbalance_ratio: 2.0      # ratio bid/ask minimal pour confirmer

tradovate:
  demo_base_url: "https://demo.tradovateapi.com/v1"
  live_base_url: "https://live.tradovateapi.com/v1"
  ws_demo_url: "wss://demo.tradovateapi.com/v1/websocket"
  ws_live_url: "wss://live.tradovateapi.com/v1/websocket"
