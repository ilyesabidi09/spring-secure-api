name: Trading Bot CI

# Tests du bot de scalping Python (trading-bot/). Independant du pipeline Java.
on:
  push:
    branches: [ main, master, "claude/**" ]
    paths: [ "trading-bot/**", ".github/workflows/trading-bot-ci.yml" ]
  pull_request:
    paths: [ "trading-bot/**", ".github/workflows/trading-bot-ci.yml" ]

jobs:
  test:
    name: Pytest + backtest smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Backtest smoke test (donnees synthetiques)
        run: python run_backtest.py
